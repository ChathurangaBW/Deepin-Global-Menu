name: Core QA

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

jobs:
  core-smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt 6 and X11 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            dbus-daemon \
            libxcb1-dev \
            ninja-build \
            pkg-config \
            qt6-base-dev

      - name: Configure core, tools, and tests
        run: |
          cmake -S . -B build -G Ninja \
            -DDGM_BUILD_PLUGIN=OFF \
            -DDGM_BUILD_TOOLS=ON \
            -DDGM_BUILD_TESTS=ON \
            -DDGM_ENABLE_X11_TRACKER=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic"

      - name: Build
        run: cmake --build build --parallel

      - name: Unit and D-Bus integration tests
        run: dbus-run-session -- ctest --test-dir build --output-on-failure

      - name: Inspector CLI smoke
        run: ./build/src/tools/dgm-inspect --help

  deepin25-plugin:
    runs-on: ubuntu-24.04
    container:
      image: linuxdeepin/deepin:25

    steps:
      - name: Install Deepin 25 development and packaging dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            dbus-daemon \
            file \
            git \
            libdde-shell-dev \
            libdtk6gui-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxtst-dev \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-wayland-dev \
            qt6-wayland-dev-tools \
            rpm

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure full Deepin plugin build
        run: |
          cmake -S . -B build-deepin -G Ninja \
            -DDGM_BUILD_PLUGIN=ON \
            -DDGM_BUILD_TOOLS=ON \
            -DDGM_BUILD_TESTS=ON \
            -DDGM_ENABLE_X11_TRACKER=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic"

      - name: Build full plugin
        run: cmake --build build-deepin --parallel

      - name: Unit and D-Bus integration tests
        run: dbus-run-session -- ctest --test-dir build-deepin --output-on-failure

      - name: Build DEB package
        run: |
          mkdir -p package-out
          cpack --config build-deepin/CPackConfig.cmake -G DEB -B package-out

      - name: Build RPM package
        run: cpack --config build-deepin/CPackConfig.cmake -G RPM -B package-out

      - name: Validate package payloads
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find package-out -maxdepth 1 -name '*.deb' -print -quit)"
          rpm_pkg="$(find package-out -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$deb"
          test -n "$rpm_pkg"

          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee /tmp/deb-contents.txt
          grep -q 'dgm-inspect' /tmp/deb-contents.txt
          grep -q 'org.deepin.ds.globalmenu' /tmp/deb-contents.txt

          rpm -qip "$rpm_pkg"
          rpm -qlp "$rpm_pkg" | tee /tmp/rpm-contents.txt
          grep -q 'dgm-inspect' /tmp/rpm-contents.txt
          grep -q 'org.deepin.ds.globalmenu' /tmp/rpm-contents.txt

      - name: Install DEB and smoke installed CLI
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find package-out -maxdepth 1 -name '*.deb' -print -quit)"
          apt-get install -y "$(realpath "$deb")"
          command -v dgm-inspect
          dgm-inspect --help

      - name: Upload installable packages
        uses: actions/upload-artifact@v4
        with:
          name: deepin-global-menu-packages
          path: |
            package-out/*.deb
            package-out/*.rpm
            package-out/*.sha256
          if-no-files-found: error
